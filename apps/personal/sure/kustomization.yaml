apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - source.yaml
  - release.yaml
  - cluster.yaml
  - database.yaml
  - credentials.sops.yaml
  - backup.yaml
  - storage-backup.yaml
  - ingress.yaml

configMapGenerator:
  - name: sure-values
    namespace: sure
    files:
      - values.yaml
    options:
      labels:
        reconcile.fluxcd.io/watch: Enabled

generatorOptions:
  disableNameSuffixHash: true
