apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sure
  namespace: sure
spec:
  chartRef:
    kind: OCIRepository
    name: sure-chart
  driftDetection:
    mode: enabled
  install:
    remediation:
      retries: 3
  interval: 2m
  timeout: 20m
  upgrade:
    cleanupOnFail: true
    remediation:
      remediateLastFailure: true
      retries: 3
      strategy: rollback
  valuesFrom:
    - kind: ConfigMap
      name: sure-values
      valuesKey: values.yaml
